name: Build Android APK & Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK Licenses & Install API 36 / 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_DIR/licenses"
          grep -q "24333f8a63b6825ea9c5514f83c2829b004d1fee" "$SDK_DIR/licenses/android-sdk-license" 2>/dev/null || \
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" >> "$SDK_DIR/licenses/android-sdk-license"
          grep -q "84831b9409646a918e30573bab4c9c91346d8abd" "$SDK_DIR/licenses/android-sdk-preview-license" 2>/dev/null || \
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" >> "$SDK_DIR/licenses/android-sdk-preview-license"
          grep -q "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" "$SDK_DIR/licenses/google-gdk-license" 2>/dev/null || \
            printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\nd975f751698a77b662f1254ddbeed3901e976f5a\n" >> "$SDK_DIR/licenses/google-gdk-license"

          accept_and_install() {
            set +o pipefail
            yes 2>/dev/null | "$@"
            local rc=${PIPESTATUS[1]}
            set -o pipefail
            return "$rc"
          }

          SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER_BIN" ]; then
            SDKMANAGER_BIN="$(command -v sdkmanager)"
          fi

          accept_and_install "$SDKMANAGER_BIN" --licenses > /dev/null 2>&1 || true
          if ! accept_and_install "$SDKMANAGER_BIN" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1"; then
            accept_and_install "$SDKMANAGER_BIN" --install "cmdline-tools;latest" > /dev/null 2>&1 || true
            [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ] && SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            accept_and_install "$SDKMANAGER_BIN" --licenses > /dev/null 2>&1 || true
            accept_and_install "$SDKMANAGER_BIN" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || \
              accept_and_install "$SDKMANAGER_BIN" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          fi

      - name: Configure Runner Swap Space
        run: |
          if [ "$(swapon --show | wc -l)" -eq 0 ]; then
            SWAP_FILE=""
            if [ -d /mnt ] && [ "$(df -Pm /mnt | awk 'NR==2{print $4}')" -ge 4096 ]; then
              SWAP_FILE="/mnt/swapfile"
            elif [ "$(df -Pm / | awk 'NR==2{print $4}')" -ge 8192 ]; then
              SWAP_FILE="/swapfile"
            fi
            if [ -n "$SWAP_FILE" ]; then
              (sudo fallocate -l 2G "$SWAP_FILE" || sudo dd if=/dev/zero of="$SWAP_FILE" bs=1M count=2048 status=none) && \
                sudo chmod 600 "$SWAP_FILE" && \
                sudo mkswap "$SWAP_FILE" && \
                sudo swapon "$SWAP_FILE" || true
            fi
          fi
          free -h

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Keystore & Configuration Files
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

          if [ ! -f app/google-services.json ] && [ -f google-services.json ]; then
            cp google-services.json app/google-services.json
            echo "Copied google-services.json to app/"
          fi

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          chmod +x gradlew

      - name: Build Debug APK via Gradle
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace --max-workers=2 -Dorg.gradle.parallel=false -Dorg.gradle.configuration-cache=false -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

      - name: Verify APK Generated
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./instaclone.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./InstaClone-v1.1.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InstaClone-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release (On Push to Main)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: InstaClone v1.1 (Build ${{ github.run_number }})
          body: |
            ## 📱 InstaClone Android APK Release
            Download and install the native Android APK on your phone:
            - **Package Name:** `com.aistudio.instaclone.vpxnqz`
            - **Architecture:** Universal Debug APK
            - **Firebase Backend:** Provisioned & Connected
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
