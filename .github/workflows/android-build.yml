name: Build Android APK & Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install API 36.1
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Keystore & Configuration Files
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

          if [ ! -f app/google-services.json ] && [ -f google-services.json ]; then
            cp google-services.json app/google-services.json
            echo "Copied google-services.json to app/"
          fi

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          chmod +x gradlew

      - name: Build Debug APK via Gradle
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verify APK Generated
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./instaclone.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./InstaClone-v1.1.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InstaClone-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release (On Push to Main)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: InstaClone v1.1 (Build ${{ github.run_number }})
          body: |
            ## 📱 InstaClone Android APK Release
            Download and install the native Android APK on your phone:
            - **Package Name:** `com.aistudio.instaclone.vpxnqz`
            - **Architecture:** Universal Debug APK
            - **Firebase Backend:** Provisioned & Connected
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
